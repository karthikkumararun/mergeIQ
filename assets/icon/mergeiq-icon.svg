<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="MergeIQ">
  <title>MergeIQ</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e36"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
    <linearGradient id="amber" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="770">
      <stop offset="0" stop-color="#f6c15d"/>
      <stop offset="1" stop-color="#e8a33d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS template: 824 px rounded square centred in the 1024 px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="102" y="102" width="820" height="820" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- two branches merging into one stem. The gradient uses user-space coordinates: the straight
       stem has a zero-width bounding box, where an objectBoundingBox gradient paints nothing. -->
  <g fill="none" stroke="url(#amber)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
    <path d="M342 322 C342 462 512 468 512 590"/>
    <path d="M682 322 C682 462 512 468 512 590"/>
    <path d="M512 590 L512 726"/>
  </g>
  <circle cx="342" cy="322" r="58" fill="#14161a" stroke="#f0b252" stroke-width="30"/>
  <circle cx="682" cy="322" r="58" fill="#14161a" stroke="#f0b252" stroke-width="30"/>
  <circle cx="512" cy="742" r="58" fill="#f0b252"/>
</svg>
