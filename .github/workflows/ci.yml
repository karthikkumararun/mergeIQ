name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      # Includes mergeiq-desktop's `ipc::tests::bindings_are_up_to_date`, which fails if
      # apps/desktop/src/ipc/bindings.ts is stale relative to the Rust command definitions.
      - name: cargo nextest run
        if: matrix.platform != 'windows-latest'
        run: cargo nextest run

      # mergeiq-desktop's test binary aborts on Windows with 0xc0000139 (entry point not
      # found) when listed by nextest — see design.md Risks/Trade-offs. Still compiled on
      # Windows via the tauri build step below; its tests run on macOS and Ubuntu.
      - name: cargo nextest run (excluding mergeiq-desktop on Windows)
        if: matrix.platform == 'windows-latest'
        run: cargo nextest run --workspace --exclude mergeiq-desktop

      - name: pnpm lint
        run: pnpm --filter desktop lint

      - name: pnpm test
        run: pnpm --filter desktop test

      - name: tauri build (debug, no bundle)
        run: pnpm --filter desktop tauri build --debug --no-bundle
