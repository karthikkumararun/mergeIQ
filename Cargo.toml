[workspace]
resolver = "2"
members = [
  "crates/mergeiq-core",
  "crates/mergeiq-git",
  "crates/mergeiq-struct",
  "crates/mergeiq-ai",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/karthikkumararun/mergeIQ"

[workspace.dependencies]
thiserror = "2"
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
