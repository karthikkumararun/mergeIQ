name: Release

# A `v<semver>` tag builds installers for every platform and publishes one GitHub Release
# (draft until everything succeeded). A manual run is a dry run: installers are attached to
# the workflow run as artifacts and no release is created. See docs/releasing.md.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fails fast on a wrong tag (seconds, not three platform builds), decides pre-release and
  # signing status, and creates the single draft release the build jobs upload into.
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_id: ${{ steps.draft.outputs.release_id }}
      signed_macos: ${{ steps.signing.outputs.macos }}
      signed_windows: ${{ steps.signing.outputs.windows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      # Tag runs: the tag version must equal the version in all three files. Manual runs: the
      # three files must at least agree with each other.
      - name: Check the tag against the versions in the repository
        id: meta
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            version="$(node scripts/release/read-versions.mjs --tag "$tag")"
          else
            version="$(node scripts/release/read-versions.mjs --consistent)"
            tag="v$version"
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Release $tag (version $version, prerelease: $prerelease)"

      # Signing is optional: without its secrets a platform builds unsigned and the release
      # notes say so.
      - name: Detect signing secrets
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          macos=false
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] \
            && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            macos=true
          fi
          windows=false
          if [ -n "$WINDOWS_CERTIFICATE" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            windows=true
          fi
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "macOS signing: $macos, Windows signing: $windows"

      # One draft shared by the matrix jobs (each creating its own would race). Re-running a
      # failed tag run reuses the draft; an already published release is never touched.
      - name: Create the draft release
        id: draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft] | @tsv" | head -n 1)"
          if [ -n "$existing" ]; then
            id="$(echo "$existing" | cut -f1)"
            draft="$(echo "$existing" | cut -f2)"
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to modify it."
              exit 1
            fi
            echo "Reusing draft release $id"
          else
            id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="MergeIQ $TAG" -f body="Release in progress." \
              -F draft=true -F prerelease="$PRERELEASE" --jq .id)"
            echo "Created draft release $id"
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    permissions:
      contents: write # tauri-action uploads installers into the draft release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: Linux
            # An older glibc than ubuntu-latest, so the AppImage and .deb run on more distros.
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # macOS signing and notarization: the secrets reach the build only when all of them are
      # configured (an empty value would be read as "set" by the bundler).
      - name: Export macOS signing secrets
        if: runner.os == 'macOS' && needs.verify.outputs.signed_macos == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            {
              echo "$name<<__SECRET_END__"
              printf '%s\n' "${!name}"
              echo "__SECRET_END__"
            } >> "$GITHUB_ENV"
          done

      # Windows Authenticode: import the certificate and point Tauri at it with a config file.
      - name: Prepare Windows signing
        id: winsign
        if: runner.os == 'Windows' && needs.verify.outputs.signed_windows == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = Join-Path $env:RUNNER_TEMP "tauri-sign.conf.json"
          @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5 | Set-Content $config
          "args=--config $config" >> $env:GITHUB_OUTPUT

      # On tag runs tauri-action uploads the installers to the shared draft release; on dry runs
      # `releaseId` is empty, so it only builds.
      - name: Build installers
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.verify.outputs.release_id }}
          # No updater yet: without this the action adds updater archives and .sig files.
          includeUpdaterJson: false
          args: ${{ matrix.args }} ${{ steps.winsign.outputs.args }}

      # The universal build must really contain both architectures in the .dmg users download
      # (Tauri removes the intermediate .app once the .dmg exists), and the CLI must be `mergeiq`.
      - name: Verify macOS universal binary
        if: runner.os == 'macOS'
        run: |
          bundle=target/universal-apple-darwin/release/bundle
          check() {
            archs="$(lipo -archs "$1")"
            echo "$1: $archs"
            for arch in arm64 x86_64; do
              case " $archs " in
                *" $arch "*) ;;
                *) echo "::error::$1 is missing the $arch slice (has: $archs)"; exit 1 ;;
              esac
            done
          }
          dmg="$(ls "$bundle"/dmg/*.dmg)"
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          check "$mount/MergeIQ.app/Contents/MacOS/mergeiq"
          archs="$(lipo -archs "$mount/MergeIQ.app/Contents/MacOS/mergeiq")"
          hdiutil detach "$mount"
          {
            echo "### macOS universal check"
            echo "\`$(basename "$dmg")\`: \`mergeiq\` has \`$archs\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List installers
        shell: bash
        run: |
          find target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -not -path '*/_CPack_Packages/*' -exec ls -l {} \;

      # Dry run only: attach the installers to the workflow run.
      - name: Upload installers as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb

  # Only when every platform built: check the asset set, checksum the exact uploaded files,
  # write the notes, then publish the draft.
  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.verify.outputs.release_id }}
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Download the release assets
        run: |
          mkdir assets
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.assets[] | "\(.id)\t\(.name)"' | while IFS=$'\t' read -r asset_id name; do
            echo "Downloading $name"
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "assets/$name"
          done
          ls -l assets

      - name: Check the asset set
        run: node scripts/release/check-assets.mjs "$VERSION" assets

      # Generated from the files that were uploaded, not from build outputs.
      - name: Generate SHA256SUMS.txt
        working-directory: assets
        run: |
          shopt -s nullglob
          files=(*.dmg *.msi *.exe *.AppImage *.deb)
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Write the release notes
        env:
          SIGNED_MACOS: ${{ needs.verify.outputs.signed_macos }}
          SIGNED_WINDOWS: ${{ needs.verify.outputs.signed_windows }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > generated.md
          flags=()
          [ "$SIGNED_MACOS" = "true" ] || flags+=(--unsigned-macos)
          [ "$SIGNED_WINDOWS" = "true" ] || flags+=(--unsigned-windows)
          node scripts/release/render-notes.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --assets assets --generated generated.md "${flags[@]}" > notes.md
          cat notes.md

      - name: Upload SHA256SUMS.txt
        run: |
          old="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.assets[] | select(.name == "SHA256SUMS.txt") | .id')"
          if [ -n "$old" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          fi
          gh api --method POST \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=SHA256SUMS.txt" \
            -H "Content-Type: text/plain" --input assets/SHA256SUMS.txt > /dev/null

      # Pre-release tags publish as pre-releases and are never marked "latest".
      - name: Publish
        run: |
          if [ "$PRERELEASE" = "true" ]; then latest=false; else latest=true; fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F body=@notes.md -F draft=false -F prerelease="$PRERELEASE" -f make_latest="$latest" > /dev/null
          echo "Published $TAG (prerelease: $PRERELEASE)"

  # After a stable release is published: render the cask from the release's own SHA256SUMS.txt,
  # gate it with Homebrew's style/audit/install checks, and push one commit to the tap. It is
  # its own job so "Re-run failed jobs" repeats only this, and it runs after `publish`, so a
  # failure here never touches the published release. Pre-releases never update the tap.
  homebrew:
    name: Update Homebrew tap
    if: github.event_name == 'push' && needs.verify.outputs.prerelease == 'false'
    needs: [verify, publish]
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      SIGNED_MACOS: ${{ needs.verify.outputs.signed_macos }}
      TAP_REPO: ${{ github.repository_owner }}/homebrew-tap
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      # Secrets cannot gate a job, so the later steps check this output instead.
      - name: Check the tap token
        id: token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Homebrew tap not updated::HOMEBREW_TAP_TOKEN is not configured; skipping the tap update. The release stays published."
          fi

      - name: Download SHA256SUMS.txt
        if: steps.token.outputs.enabled == 'true'
        run: gh release download "$TAG" --pattern SHA256SUMS.txt --dir .

      - name: Render the cask
        if: steps.token.outputs.enabled == 'true'
        run: |
          args=(--version "$VERSION" --checksums SHA256SUMS.txt --out out/Casks/mergeiq.rb)
          [ "$SIGNED_MACOS" = "true" ] && args+=(--signed)
          node scripts/release/render-cask.mjs "${args[@]}"
          cat out/Casks/mergeiq.rb

      # The cask must pass Homebrew's own checks and really install before it reaches the tap.
      - name: Gate the cask (style, audit, install, uninstall)
        if: steps.token.outputs.enabled == 'true'
        run: |
          brew tap-new --no-git local/mergeiq-test
          tap="$(brew --repository local/mergeiq-test)"
          mkdir -p "$tap/Casks"
          cp out/Casks/mergeiq.rb "$tap/Casks/mergeiq.rb"
          brew style --cask local/mergeiq-test/mergeiq
          brew audit --cask --online --strict local/mergeiq-test/mergeiq
          brew install --cask local/mergeiq-test/mergeiq
          # An unsigned app needs the quarantine attribute cleared once, as the cask's caveat says.
          if [ "$SIGNED_MACOS" != "true" ]; then
            xattr -dr com.apple.quarantine /Applications/MergeIQ.app
          fi
          bin="$(brew --prefix)/bin/mergeiq"
          test -L "$bin"
          reported="$("$bin" --version)"
          echo "mergeiq --version: $reported"
          [ "$reported" = "mergeiq $VERSION" ] || { echo "::error::expected 'mergeiq $VERSION', got '$reported'"; exit 1; }
          brew uninstall --cask local/mergeiq-test/mergeiq
          if [ -e "$bin" ] || [ -e /Applications/MergeIQ.app ]; then
            echo "::error::uninstall left the app or the mergeiq link behind"
            exit 1
          fi
          brew untap local/mergeiq-test

      # One commit, `mergeiq <version>`, touching only Casks/mergeiq.rb. An empty tap (no commits
      # yet) gets its first commit on `main`; re-running with an unchanged cask pushes nothing.
      - name: Push the cask to the tap
        if: steps.token.outputs.enabled == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          auth="$(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64)"
          echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone "https://github.com/$TAP_REPO.git" tap
          cd tap
          if git rev-parse --verify --quiet HEAD > /dev/null; then
            branch="$(git symbolic-ref --short HEAD)"
          else
            branch=main
            git checkout -q -b "$branch"
          fi
          mkdir -p Casks
          cp ../out/Casks/mergeiq.rb Casks/mergeiq.rb
          git add Casks/mergeiq.rb
          changed="$(git diff --cached --name-only)"
          if [ -z "$changed" ]; then
            echo "::notice::The tap already has the cask for $VERSION; nothing to push."
            exit 0
          fi
          if [ "$changed" != "Casks/mergeiq.rb" ]; then
            echo "::error::unexpected changes staged: $changed"
            exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "mergeiq $VERSION"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$branch"
          echo "Pushed mergeiq $VERSION to $TAP_REPO ($branch)"
