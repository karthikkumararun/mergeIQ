[package]
name = "mergeiq-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MergeIQ desktop application"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "mergeiq"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mergeiq_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
specta = { version = "2.0.0-rc.25", features = ["serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
thiserror.workspace = true
mergeiq-core = { path = "../../../crates/mergeiq-core", features = ["specta"] }
mergeiq-git = { path = "../../../crates/mergeiq-git", features = ["specta"] }
mergeiq-struct = { path = "../../../crates/mergeiq-struct", features = ["specta"] }
mergeiq-ai = { path = "../../../crates/mergeiq-ai", features = ["specta"] }
clap = { version = "4", features = ["derive"] }
interprocess = "2"
tauri-plugin-dialog = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }

[target."cfg(windows)".dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
