<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Merge editor with base pane</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:#16181C}</style>
</helmet>
<div style="min-height: 900px; background: #16181C">
  <dc-import name="MergeEditor" theme="dark" show-base="{{yes}}" hint-size="100%,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
